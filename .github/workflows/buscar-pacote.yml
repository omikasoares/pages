# Publica arquivos binários (imagens) e HTML no pages sem passar o conteúdo pelo MCP do GitHub.
# Como usar: criar um arquivo _buscar/<nome>.txt com a URL de um .tar.gz na primeira linha.
# A Action baixa o pacote, confere os caminhos, extrai na raiz do repositório, apaga o .txt e faz o commit.
# Só aceita caminhos dentro de pastas que começam com um prefixo permitido (PREFIXOS) e recusa ".." e caminhos absolutos.
name: Buscar pacote

on:
  push:
    branches: [main]
    paths: ['_buscar/*.txt']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: buscar-pacote
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e extrair
        run: |
          python3 - <<'PY'
          import pathlib, tarfile, urllib.request
          PREFIXOS = ('doughboy-',)
          for txt in sorted(pathlib.Path('_buscar').glob('*.txt')):
              url = txt.read_text().strip().splitlines()[0].strip()
              if not url.startswith('https://'):
                  raise SystemExit(f'URL invalida em {txt}')
              destino = pathlib.Path('/tmp') / (txt.stem + '.tar.gz')
              req = urllib.request.Request(url, headers={'User-Agent': 'autz-buscar-pacote'})
              destino.write_bytes(urllib.request.urlopen(req, timeout=60).read())
              print(f'{txt.name}: {destino.stat().st_size} bytes')
              with tarfile.open(destino, 'r:gz') as t:
                  membros = []
                  for m in t.getmembers():
                      nome = m.name
                      if not m.isfile():
                          continue
                      if nome.startswith('/') or '..' in nome.split('/') or not nome.startswith(PREFIXOS):
                          raise SystemExit(f'caminho recusado: {nome}')
                      membros.append(m)
                  for m in membros:
                      p = pathlib.Path(m.name)
                      p.parent.mkdir(parents=True, exist_ok=True)
                      p.write_bytes(t.extractfile(m).read())
                      print('gravado', m.name, m.size)
              txt.unlink()
          PY

      - name: Commit e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nada a alterar."; exit 0; fi
          git config user.name "autz-pacote[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pacote publicado por URL (buscar-pacote)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Build do Pages segue pelo push."
