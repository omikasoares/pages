<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Secretária AUTZ</title>
<link rel="icon" type="image/png" href="../assets/favicon-autz.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#00272C;--bg2:#001e23;--card:#00323A;--lime:#E9FF4A;--txt:#fff;--cinza:#8fb0b7;--linha:rgba(255,255,255,.09);--verde:#4ade80;--verm:#ff8a70;--amb:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--linha);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:150px}
header h1 span{color:var(--lime)}
.selo{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06)}
.selo i{width:9px;height:9px;border-radius:50%;background:var(--cinza)}
.selo.on i{background:var(--verde);box-shadow:0 0 0 4px rgba(74,222,128,.18)}
.selo.off i{background:var(--verm);box-shadow:0 0 0 4px rgba(255,138,112,.18)}
.quem{font-size:13px;color:var(--cinza)}
.quem b{color:var(--txt)}
button,.btn{font:600 13px Poppins,sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.prim{background:var(--lime);color:var(--bg2)}
.sec{background:rgba(255,255,255,.08);color:var(--txt)}
.ghost{background:transparent;color:var(--cinza);border:1px solid var(--linha)}
button:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:0 auto;padding:16px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px;color:var(--cinza);font-size:13px}
.abas{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.aba{background:rgba(255,255,255,.06);color:var(--cinza)}
.aba.on{background:var(--lime);color:var(--bg2)}
.aba b{margin-left:4px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:14px}
.cab{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nome{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--cinza)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(233,255,74,.12);color:var(--lime);margin-left:6px}
.tag.g{background:rgba(127,212,255,.12);color:#7fd4ff}
.pessoa{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#004650;color:var(--lime);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.cat{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-left:6px;text-transform:capitalize}
.cat-cliente{background:rgba(233,255,74,.14);color:var(--lime)}
.cat-parceiro{background:rgba(127,212,255,.14);color:#7fd4ff}
.cat-fornecedor{background:rgba(251,191,36,.14);color:var(--amb)}
.cat-prospect{background:rgba(74,222,128,.14);color:var(--verde)}
.cat-equipe{background:rgba(196,160,255,.16);color:#c9a7ff}
.cat-pessoal,.cat-outro{background:rgba(255,255,255,.08);color:var(--cinza)}
.resumo{margin:10px 0;font-size:14px;padding:10px 12px;background:rgba(0,0,0,.18);border-radius:10px;border-left:3px solid var(--lime)}
.resumo.vazio{border-left-color:var(--cinza);color:var(--cinza);font-style:italic}
textarea{width:100%;min-height:84px;resize:vertical;background:var(--bg2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font:14px Poppins,sans-serif}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(233,255,74,.5)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acoes .esp{flex:1}
.mic.grav{background:var(--verm);color:#fff;animation:pul 1s infinite}
@keyframes pul{50%{opacity:.6}}
.vazio-geral{text-align:center;color:var(--cinza);padding:60px 10px}
.agenda{display:none;margin-top:10px;padding:12px;border:1px dashed rgba(233,255,74,.35);border-radius:10px;background:rgba(0,0,0,.15)}
.agenda.ab{display:block}
input,select{background:var(--bg2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:9px 11px;font:14px Poppins,sans-serif;color-scheme:dark;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{background:rgba(255,255,255,.08);color:var(--txt);padding:6px 10px;font-size:12px}
.linha-ag{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quando{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--lime);font-weight:600;margin:10px 0 0}
.aviso{margin:10px 0 0;font-size:13px;padding:8px 12px;border-radius:10px;background:rgba(251,191,36,.12);color:var(--amb)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.ab{display:flex}
.caixa{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.caixa img{width:100%;max-width:280px;background:#fff;border-radius:12px;padding:10px;margin:12px auto;display:block}
.codigo{font-size:30px;font-weight:700;letter-spacing:.12em;color:var(--lime);margin:14px 0}
.caixa p{font-size:13px;color:var(--cinza);margin:6px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--lime);color:var(--bg2);font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90vw;text-align:center}
svg{width:16px;height:16px;flex:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:26px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0 0 4px;font-size:20px}
#login h2 span{color:var(--lime)}
#login p{margin:0;font-size:13px;color:var(--cinza)}
#login input{width:100%}
#login .erro{color:var(--verm);font-size:13px;min-height:18px}
.log{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.log .l1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.log .l1 b{font-size:14px}
.log .acao{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--cinza)}
.log .acao.enviou,.log .acao.enviou_agendado{background:rgba(74,222,128,.14);color:var(--verde)}
.log .acao.agendou{background:rgba(233,255,74,.14);color:var(--lime)}
.log .acao.falha_envio,.log .acao.falha_agendado{background:rgba(255,138,112,.16);color:var(--verm)}
.log .txt{margin-top:8px;font-size:14px;white-space:pre-wrap}
.log .orig{margin-top:6px;font-size:12px;color:var(--cinza);white-space:pre-wrap;border-left:2px solid var(--linha);padding-left:8px}
.selo-ia{font-size:11px;font-weight:600;color:var(--cinza)}
.selo-ia.edit{color:var(--amb)}
.filtro{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sep{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--linha);color:var(--cinza);font-size:13px}
[hidden]{display:none!important}
@media(max-width:560px){.acoes .esp{display:none}.acoes button,.acoes .btn{flex:1;justify-content:center}}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="formLogin" autocomplete="on">
    <h2>Secretária <span>AUTZ</span></h2>
    <p>Entre com seu usuário. Tudo o que você enviar fica registrado no seu nome.</p>
    <input id="lgUser" name="username" placeholder="Usuário" autocomplete="username" autocapitalize="none" required>
    <input id="lgPass" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    <div class="erro" id="lgErro"></div>
    <button class="prim" type="submit" id="lgBtn" style="justify-content:center">Entrar</button>
  </form>
</div>
<div id="app" hidden>
<header>
  <h1>Secretária <span>AUTZ</span></h1>
  <span class="selo" id="selo"><i></i><span id="seloTxt">Verificando...</span></span>
  <button class="sec" id="btnRecon" style="display:none">Reconectar</button>
  <span class="quem">Logado como <b id="quemNome"></b></span>
  <button class="ghost" id="btnSair">Sair</button>
</header>
<main>
  <div class="abas">
    <button class="aba on" data-aba="pend">Pendentes<b id="nPend"></b></button>
    <button class="aba" data-aba="agen">Agendadas<b id="nAgen"></b></button>
    <button class="aba" data-aba="log" id="abaLog" hidden>Registro</button>
  </div>
  <div class="topo"><span id="contagem">Carregando...</span><span class="filtro" id="filtroLog" hidden><select id="selPessoa"><option value="">Todos</option></select></span><button class="ghost" id="btnAtual">Atualizar</button></div>
  <div id="lista"></div>
</main>
</div>
<div class="modal" id="modal"><div class="caixa">
  <h3 style="margin:0">Conectar WhatsApp</h3>
  <p>No celular do Mika: Aparelhos conectados, Conectar aparelho. Escolha uma opção abaixo e use só ela.</p>
  <div id="modalCorpo"></div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
    <button class="sec" id="btnQr">QR Code</button>
    <button class="sec" id="btnCod">Código</button>
    <button class="ghost" id="btnFechar">Fechar</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var API = 'https://webhook.autz.com.br/webhook/sec-api-9f98d6085d7e51bd';
var token = '', eu = { nome: '', papel: '' };
var editados = {}, abertos = {}, gravando = null;
var aba = 'pend', dados = { itens: [], agendadas: [] }, registro = [];
function $(id){ return document.getElementById(id); }
function lerToken(){ try { return localStorage.getItem('sec_token') || ''; } catch (e) { return ''; } }
function gravarToken(t){ try { if (t) localStorage.setItem('sec_token', t); else localStorage.removeItem('sec_token'); } catch (e) {} }
function toast(t){ var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(function(){ e.style.display = 'none'; }, 3000); }
function api(acao, corpo){
  var op = { method: 'POST', headers: {} };
  if (token) op.headers.Authorization = 'Bearer ' + token;
  if (corpo instanceof FormData) op.body = corpo;
  else { op.headers['Content-Type'] = 'application/json'; op.body = JSON.stringify(corpo || {}); }
  return fetch(API + '?acao=' + acao, op).then(function(r){ return r.json(); }).then(function(r){
    if (r && r.erro === 'sessao' && acao !== 'login') { sair('Sua sessão expirou. Entre de novo.'); throw new Error('sessao'); }
    return r;
  });
}
function esc(s){ return String(s || '').replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tempo(ts){ var d = (Date.now() - Date.parse(ts)) / 60000; if (!(d >= 0)) return ''; if (d < 1) return 'agora'; if (d < 60) return Math.round(d) + ' min'; if (d < 1440) return Math.round(d / 60) + ' h'; return Math.round(d / 1440) + ' d'; }
function fone(t){ t = String(t || ''); if (t.length === 13) return '(' + t.slice(2, 4) + ') ' + t.slice(4, 9) + '-' + t.slice(9); if (t.length === 12) return '(' + t.slice(2, 4) + ') ' + t.slice(4, 8) + '-' + t.slice(8); return t; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function paraInput(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function prox8(){ var r = new Date(); var antes = r.getHours() < 8; r.setHours(8, 0, 0, 0); if (!antes) r.setDate(r.getDate() + 1); return r; }
function padrao(){ var h = new Date().getHours(); if (h >= 8 && h < 18) { var d = new Date(Date.now() + 3600000); d.setSeconds(0, 0); return d; } return prox8(); }
function quandoTxt(iso){ var d = new Date(iso); if (isNaN(d)) return ''; var hoje = new Date(), am = new Date(Date.now() + 86400000); var hr = pad(d.getHours()) + ':' + pad(d.getMinutes()); if (d.toDateString() === hoje.toDateString()) return 'hoje às ' + hr; if (d.toDateString() === am.toDateString()) return 'amanhã às ' + hr; return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }) + ' às ' + hr; }
function dataHora(iso){ var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
var ICO_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
var ICO_ENV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>';
var ICO_VER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>';
var ICO_REL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function iniciais(n){ n = String(n || '?').trim().split(' ').filter(Boolean); return ((n[0] || '?')[0] + ((n[1] || '')[0] || '')).toUpperCase(); }
function avatar(it){ var ini = '<span class="av">' + esc(iniciais(it.nome)) + '</span>'; if (!it.foto) return ini; return '<img class="av" alt="" src="' + esc(it.foto) + '" onerror="this.outerHTML=this.dataset.ini" data-ini="' + esc(ini) + '">'; }
function semPend(it){ return String(it.resumo || '').indexOf('Sem pendência') === 0; }
function item(jid){ var a = dados.itens.concat(dados.agendadas); for (var i = 0; i < a.length; i++) if (a[i].chat_jid === jid) return a[i]; return {}; }

function cabecalho(it){
  var link = it.grupo ? 'https://web.whatsapp.com/' : ('https://web.whatsapp.com/send?phone=' + it.telefone);
  return '<div class="cab"><div class="pessoa">' + avatar(it) + '<div style="min-width:0"><span class="nome">' + esc(it.nome || fone(it.telefone) || 'Grupo') + '</span>' +
    (it.categoria ? '<span class="cat cat-' + esc(it.categoria) + '">' + esc(it.categoria) + '</span>' : '') +
    (it.cliente ? '<span class="tag">' + esc(it.cliente) + '</span>' : '') + (it.grupo ? '<span class="tag g">Grupo</span>' : '') +
    '<div class="meta">' + (it.grupo ? '' : esc(fone(it.telefone)) + ' · ') + 'há ' + tempo(it.ultima_msg_ts) + '</div></div></div>' +
    '<a class="btn sec" target="_blank" rel="noopener" href="' + link + '">' + ICO_VER + 'Ver conversa</a></div>';
}
function painel(jid, rotulo){
  return '<div class="agenda" data-jid="' + esc(jid) + '"><div class="chips">' +
    '<button class="chip" data-acao="chip" data-q="8" data-jid="' + esc(jid) + '">Próximas 08:00</button>' +
    '<button class="chip" data-acao="chip" data-q="60" data-jid="' + esc(jid) + '">Em 1 hora</button>' +
    '<button class="chip" data-acao="chip" data-q="180" data-jid="' + esc(jid) + '">Em 3 horas</button></div>' +
    '<div class="linha-ag"><input type="datetime-local" data-jid="' + esc(jid) + '">' +
    '<button class="prim" data-acao="confagendar" data-jid="' + esc(jid) + '">' + ICO_REL + rotulo + '</button></div></div>';
}
function cardPend(it){
  var jid = it.chat_jid;
  var texto = editados[jid] !== undefined ? editados[jid] : (it.texto_agendado || it.sugestao || '');
  return '<div class="card" data-jid="' + esc(jid) + '">' + cabecalho(it) +
    (it.aviso ? '<div class="aviso">' + esc(it.aviso) + '</div>' : '') +
    '<div class="resumo' + (it.resumo ? '' : ' vazio') + '">' + esc(it.resumo || 'Preparando resumo...') + '</div>' +
    '<textarea data-jid="' + esc(jid) + '" placeholder="Escreva ou grave a resposta">' + esc(texto) + '</textarea>' +
    '<div class="acoes"><button class="sec mic" data-acao="mic" data-jid="' + esc(jid) + '">' + ICO_MIC + 'Gravar</button>' +
    '<button class="ghost" data-acao="ignorar" data-jid="' + esc(jid) + '">Ignorar</button><span class="esp"></span>' +
    '<button class="sec" data-acao="agendar" data-jid="' + esc(jid) + '">' + ICO_REL + 'Agendar</button>' +
    '<button class="prim" data-acao="enviar" data-jid="' + esc(jid) + '">' + ICO_ENV + 'Enviar</button></div>' +
    painel(jid, 'Confirmar agendamento') + '</div>';
}
function cardAgen(it){
  var jid = it.chat_jid;
  var texto = editados[jid] !== undefined ? editados[jid] : (it.mensagem_agendada || '');
  return '<div class="card" data-jid="' + esc(jid) + '">' + cabecalho(it) +
    '<div class="quando">' + ICO_REL + 'Sai ' + esc(quandoTxt(it.agendado_para)) + (it.agendado_por ? ' · agendado por ' + esc(it.agendado_por) : '') + '</div>' +
    (it.aviso ? '<div class="aviso">' + esc(it.aviso) + '</div>' : '') +
    (it.resumo ? '<div class="resumo">' + esc(it.resumo) + '</div>' : '') +
    '<textarea data-jid="' + esc(jid) + '">' + esc(texto) + '</textarea>' +
    '<div class="acoes"><button class="sec mic" data-acao="mic" data-jid="' + esc(jid) + '">' + ICO_MIC + 'Gravar</button>' +
    '<button class="ghost" data-acao="cancelar" data-jid="' + esc(jid) + '">Cancelar agendamento</button><span class="esp"></span>' +
    '<button class="sec" data-acao="agendar" data-jid="' + esc(jid) + '">' + ICO_REL + 'Mudar horário</button>' +
    '<button class="prim" data-acao="enviar" data-jid="' + esc(jid) + '">' + ICO_ENV + 'Enviar agora</button></div>' +
    painel(jid, 'Salvar novo horário') + '</div>';
}
var ROT = { enviou: 'enviou', enviou_agendado: 'envio agendado saiu', falha_envio: 'falha no envio', falha_agendado: 'falha no envio agendado', agendou: 'agendou', cancelou_agendamento: 'cancelou agendamento', ignorou: 'ignorou' };
function cardLog(r){
  var editou = r.sugestao_ia && r.texto && r.sugestao_ia.trim() !== r.texto.trim();
  var ia = '';
  if (r.acao === 'enviou' || r.acao === 'agendou') ia = r.sugestao_ia ? (editou ? '<span class="selo-ia edit">editou a sugestão da IA</span>' : '<span class="selo-ia">usou a sugestão da IA</span>') : '';
  return '<div class="log"><div class="l1"><b>' + esc(r.nome || r.usuario) + '</b><span class="acao ' + esc(r.acao) + '">' + esc(ROT[r.acao] || r.acao) + '</span>' +
    '<span>' + esc(r.contato || r.chat_jid) + '</span><span class="meta">' + esc(dataHora(r.ts)) + '</span>' + ia + '</div>' +
    (r.texto ? '<div class="txt">' + esc(r.texto) + '</div>' : '') +
    (editou ? '<div class="orig">Sugestão original: ' + esc(r.sugestao_ia) + '</div>' : '') +
    (r.detalhe ? '<div class="meta" style="margin-top:6px">' + esc(r.detalhe.indexOf('para ') === 0 || r.detalhe.indexOf('agendado para ') === 0 ? r.detalhe.replace(/(\d{4}-\d\d-\d\dT[^ ]+)/, function(m){ return quandoTxt(m); }) : r.detalhe) + '</div>' : '') + '</div>';
}
function render(forcar){
  var p = dados.itens, a = dados.agendadas;
  $('nPend').textContent = p.length ? ' ' + p.length : ''; $('nAgen').textContent = a.length ? ' ' + a.length : '';
  $('filtroLog').hidden = aba !== 'log';
  if (aba === 'log') {
    var pessoa = $('selPessoa').value;
    var lr = registro.filter(function(r){ return !pessoa || (r.nome || r.usuario) === pessoa; });
    $('contagem').textContent = lr.length + (lr.length === 1 ? ' ação registrada' : ' ações registradas');
    $('lista').innerHTML = lr.length ? lr.map(cardLog).join('') : '<div class="vazio-geral">Nenhuma ação registrada ainda.</div>';
    return;
  }
  var lista = aba === 'pend' ? p : a;
  if (aba === 'pend') $('contagem').textContent = p.length ? (p.length + (p.length === 1 ? ' conversa esperando resposta' : ' conversas esperando resposta')) : 'Nada pendente';
  else $('contagem').textContent = a.length ? (a.length + (a.length === 1 ? ' resposta agendada' : ' respostas agendadas')) : 'Nenhuma resposta agendada';
  if (!forcar) {
    var ativo = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.jid : null;
    if (ativo || gravando || Object.keys(abertos).length) return;
  }
  if (!lista.length) { $('lista').innerHTML = '<div class="vazio-geral">' + (aba === 'pend' ? 'Tudo respondido por aqui.' : 'Nada agendado.') + '</div>'; return; }
  if (aba === 'pend') {
    var com = p.filter(function(x){ return !semPend(x); }), sem = p.filter(semPend);
    $('lista').innerHTML = com.map(cardPend).join('') +
      (sem.length ? '<div class="sep"><span>Sem pendência (' + sem.length + '): avisos, agradecimentos e confirmações</span><button class="ghost" id="btnIgnTodas">Ignorar todas</button></div>' + sem.map(cardPend).join('') : '');
    return;
  }
  $('lista').innerHTML = lista.map(cardAgen).join('');
}
function carregar(forcar){
  if (!token) return;
  api('lista').then(function(r){ dados = { itens: r.itens || [], agendadas: r.agendadas || [] }; if (aba !== 'log') render(forcar); else render(true); }).catch(function(e){ if (e.message !== 'sessao') $('contagem').textContent = 'Erro ao carregar'; });
}
function carregarLog(){
  api('registro').then(function(r){
    registro = r.registro || [];
    var nomes = {}; registro.forEach(function(x){ nomes[x.nome || x.usuario] = 1; });
    var sel = $('selPessoa'), atual = sel.value;
    sel.innerHTML = '<option value="">Todos</option>' + Object.keys(nomes).sort().map(function(n){ return '<option' + (n === atual ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    render(true);
  }).catch(function(){});
}
function status(){
  if (!token) return;
  api('status').then(function(r){
    var s = $('selo');
    if (r.conectado) { s.className = 'selo on'; $('seloTxt').textContent = 'Conectado' + (r.numero ? ' · ' + fone(r.numero) : ''); $('btnRecon').style.display = 'none'; }
    else { s.className = 'selo off'; $('seloTxt').textContent = 'Desconectado'; $('btnRecon').style.display = ''; }
  }).catch(function(){ $('seloTxt').textContent = 'Sem resposta'; });
}
function entrar(){
  $('login').hidden = true; $('app').hidden = false;
  $('quemNome').textContent = eu.nome;
  $('abaLog').hidden = eu.papel !== 'admin';
  carregar(true); status();
}
function sair(msg){
  token = ''; gravarToken(''); eu = { nome: '', papel: '' };
  $('app').hidden = true; $('login').hidden = false; $('lgErro').textContent = msg || ''; $('lgPass').value = '';
}
$('formLogin').addEventListener('submit', function(e){
  e.preventDefault();
  $('lgBtn').disabled = true; $('lgErro').textContent = '';
  api('login', { usuario: $('lgUser').value, senha: $('lgPass').value }).then(function(r){
    $('lgBtn').disabled = false;
    if (!r.ok) { $('lgErro').textContent = r.erro || 'Não foi possível entrar'; return; }
    token = r.token; gravarToken(token); eu = { nome: r.nome, papel: r.papel }; entrar();
  }).catch(function(){ $('lgBtn').disabled = false; $('lgErro').textContent = 'Falha de conexão'; });
});
$('btnSair').onclick = function(){ sair(''); };
document.addEventListener('click', function(e){
  var b = e.target.closest('#btnIgnTodas'); if (!b) return;
  var sem = dados.itens.filter(semPend);
  if (!sem.length || !confirm('Ignorar as ' + sem.length + ' conversas sem pendência?')) return;
  b.disabled = true; b.textContent = 'Ignorando...';
  var i = 0;
  (function prox(){
    if (i >= sem.length) { toast(sem.length + ' conversas ignoradas'); carregar(true); return; }
    var it = sem[i++];
    api('ignorar', { chat_jid: it.chat_jid, contato: it.nome || fone(it.telefone) || '', sugestao_ia: it.sugestao || '' }).then(prox, prox);
  })();
});
$('selPessoa').onchange = function(){ render(true); };

document.addEventListener('input', function(e){ if (e.target.tagName === 'TEXTAREA') editados[e.target.dataset.jid] = e.target.value; });
document.addEventListener('click', function(e){
  var t = e.target.closest('button[data-aba]'); if (!t) return;
  aba = t.dataset.aba; abertos = {}; editados = {};
  Array.prototype.forEach.call(document.querySelectorAll('.aba'), function(x){ x.classList.toggle('on', x === t); });
  if (aba === 'log') { $('lista').innerHTML = '<div class="vazio-geral">Carregando registro...</div>'; carregarLog(); } else render(true);
});
document.addEventListener('click', function(e){
  var b = e.target.closest('button[data-acao]'); if (!b) return;
  var jid = b.dataset.jid, card = b.closest('.card'); if (!card) return;
  var ta = card.querySelector('textarea'), pn = card.querySelector('.agenda'), inp = pn && pn.querySelector('input');
  var it = item(jid);
  var base = { chat_jid: jid, contato: it.nome || fone(it.telefone) || '', sugestao_ia: it.sugestao || it.mensagem_agendada || '' };
  var acao = b.dataset.acao;
  if (acao === 'agendar') {
    if (pn.classList.contains('ab')) { pn.classList.remove('ab'); delete abertos[jid]; return; }
    pn.classList.add('ab'); abertos[jid] = 1; if (!inp.value) inp.value = paraInput(padrao());
  }
  if (acao === 'chip') { var q = Number(b.dataset.q), d0 = q === 8 ? prox8() : new Date(Date.now() + q * 60000); d0.setSeconds(0, 0); inp.value = paraInput(d0); }
  if (acao === 'confagendar') {
    var txt = ta.value.trim(); if (!txt) { toast('Escreva a resposta antes'); return; }
    var d = new Date(inp.value); if (isNaN(d) || d.getTime() < Date.now() + 30000) { toast('Escolha um horário no futuro'); return; }
    b.disabled = true;
    api('agendar', Object.assign(base, { texto: txt, quando: d.toISOString() })).then(function(r){
      if (r.ok) { delete editados[jid]; delete abertos[jid]; toast('Agendado para ' + quandoTxt(d.toISOString())); carregar(true); }
      else { b.disabled = false; toast('Não agendou'); }
    }).catch(function(){ b.disabled = false; toast('Falha de conexão'); });
  }
  if (acao === 'cancelar') {
    b.disabled = true;
    api('cancelar', Object.assign(base, { texto: ta.value.trim() })).then(function(){ delete editados[jid]; delete abertos[jid]; toast('Agendamento cancelado. Voltou para Pendentes'); carregar(true); })
      .catch(function(){ b.disabled = false; toast('Falha de conexão'); });
  }
  if (acao === 'enviar') {
    var tx = ta.value.trim(); if (!tx) { toast('Escreva a resposta antes'); return; }
    b.disabled = true; b.textContent = 'Enviando...';
    api('enviar', Object.assign(base, { texto: tx })).then(function(r){
      if (r.ok) { delete editados[jid]; delete abertos[jid]; card.remove(); toast('Enviado'); carregar(true); }
      else { b.disabled = false; b.innerHTML = ICO_ENV + 'Enviar'; toast('Não enviou: ' + (r.erro || 'erro')); }
    }).catch(function(){ b.disabled = false; b.innerHTML = ICO_ENV + 'Enviar'; toast('Falha de conexão'); });
  }
  if (acao === 'ignorar') {
    api('ignorar', base).then(function(){ delete editados[jid]; delete abertos[jid]; card.remove(); carregar(true); });
  }
  if (acao === 'mic') {
    if (gravando) { gravando.rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Este navegador não grava áudio'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(st){
      var partes = [], rec = new MediaRecorder(st);
      gravando = { rec: rec, btn: b };
      b.classList.add('grav'); b.innerHTML = ICO_MIC + 'Parar';
      rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) partes.push(ev.data); };
      rec.onstop = function(){
        st.getTracks().forEach(function(x){ x.stop(); });
        b.classList.remove('grav'); b.innerHTML = 'Transcrevendo...'; b.disabled = true;
        var tipo = rec.mimeType || 'audio/webm', ext = tipo.indexOf('mp4') >= 0 ? 'm4a' : (tipo.indexOf('ogg') >= 0 ? 'ogg' : 'webm');
        var fd = new FormData(); fd.append('audio', new Blob(partes, { type: tipo }), 'gravacao.' + ext);
        api('transcrever', fd).then(function(r){
          gravando = null; b.disabled = false; b.innerHTML = ICO_MIC + 'Gravar';
          if (r.texto) { ta.value = (ta.value.trim() ? ta.value.trim() + String.fromCharCode(10) : '') + r.texto; editados[jid] = ta.value; ta.focus(); }
          else toast('Não entendi o áudio' + (r.erro ? ': ' + r.erro : ''));
        }).catch(function(){ gravando = null; b.disabled = false; b.innerHTML = ICO_MIC + 'Gravar'; toast('Falha ao transcrever'); });
      };
      rec.start();
    }).catch(function(){ toast('Permita o microfone no navegador'); });
  }
});

var timer = null, travaCod = 0;
function abrir(){ $('modal').classList.add('ab'); $('modalCorpo').innerHTML = '<p>Escolha QR Code ou Código.</p>'; }
function fechar(){ $('modal').classList.remove('ab'); clearTimeout(timer); status(); }
function conectar(modo){
  clearTimeout(timer);
  if (modo === 'codigo') {
    var falta = Math.ceil((travaCod - Date.now()) / 1000);
    if (falta > 0) { toast('Use o código que está na tela. Novo código em ' + falta + 's'); return; }
    travaCod = Date.now() + 60000; $('btnCod').disabled = true; setTimeout(function(){ $('btnCod').disabled = false; }, 60000);
  }
  $('modalCorpo').innerHTML = '<p>Gerando...</p>';
  api('conectar', { modo: modo }).then(function(r){
    if (r.conectado) { $('modalCorpo').innerHTML = '<p style="color:#4ade80">Conectado.</p>'; setTimeout(fechar, 1200); return; }
    if (modo === 'qr' && r.qr) { $('modalCorpo').innerHTML = '<img alt="QR Code" src="' + r.qr + '"><p>Leia com o celular. Um novo QR aparece quando este expirar.</p>'; timer = setTimeout(function(){ checar('qr'); }, 28000); }
    else if (modo === 'codigo' && r.codigo) { $('modalCorpo').innerHTML = '<div class="codigo">' + esc(r.codigo) + '</div><p>Em "Conectar com número de telefone", digite este código agora. Não gere outro enquanto digita.</p>'; timer = setTimeout(function(){ checar(null); }, 5000); }
    else $('modalCorpo').innerHTML = '<p>Não consegui gerar: ' + esc(r.erro || 'tente de novo') + '</p>';
  }).catch(function(){ $('modalCorpo').innerHTML = '<p>Falha de conexão.</p>'; });
}
function checar(modo){
  api('status').then(function(r){
    if (r.conectado) { $('modalCorpo').innerHTML = '<p style="color:#4ade80">Conectado.</p>'; setTimeout(fechar, 1200); }
    else if (modo) conectar(modo); else timer = setTimeout(function(){ checar(null); }, 5000);
  });
}
$('btnRecon').onclick = abrir; $('btnQr').onclick = function(){ conectar('qr'); }; $('btnCod').onclick = function(){ conectar('codigo'); }; $('btnFechar').onclick = fechar;
$('btnAtual').onclick = function(){
  var b = this; abertos = {};
  b.disabled = true; b.textContent = 'Atualizando...';
  var fim = function(ok){ b.disabled = false; b.textContent = 'Atualizar'; toast(ok ? 'Atualizado' : 'Não consegui atualizar'); };
  if (aba === 'log') { api('registro').then(function(r){ registro = r.registro || []; render(true); fim(true); }).catch(function(){ fim(false); }); return; }
  api('lista').then(function(r){ dados = { itens: r.itens || [], agendadas: r.agendadas || [] }; render(true); fim(true); }).catch(function(){ fim(false); });
};
document.addEventListener('focusout', function(e){ if (e.target.tagName === 'TEXTAREA') setTimeout(function(){ carregar(); }, 300); });
setInterval(function(){ if (aba !== 'log') carregar(); }, 30000); setInterval(status, 20000);

token = lerToken();
if (token) {
  api('eu').then(function(r){ if (r.ok) { eu = { nome: r.nome, papel: r.papel }; entrar(); } else sair(''); }).catch(function(){ sair(''); });
} else sair('');
})();
</script>
